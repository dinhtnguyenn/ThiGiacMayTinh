name: Deploy to Server

on:
  push:
    branches:
      - main
      - master

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependency
        run: python -m pip install numpy==2.2.5

      - name: Validate application
        run: |
          node --check app.js
          python -m py_compile server/*.py
          python -m unittest discover -s tests
          FACEOPS_DATA_VOLUME=faceops-ci-data docker compose config --quiet

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy files to server via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          # scp-action has no `exclude` input. Upload only runtime files so the
          # server's existing .env and Docker data volume remain untouched.
          source: "Dockerfile,docker-compose.yml,requirements.txt,index.html,app.js,styles.css,tokens.css,server"
          target: "/root/ThiGiacMayTinh"
          rm: false

      - name: Restart Docker Compose
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            cd /root/ThiGiacMayTinh
            docker compose up -d --build --wait --wait-timeout 120
            docker compose ps
            docker compose logs --tail=100 faceops
            docker compose exec -T faceops sh -c 'test -s /data/faceops.sqlite3 && ls -lh /data/faceops.sqlite3'
