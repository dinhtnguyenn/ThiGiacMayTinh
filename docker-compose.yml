services:
  faceops:
    build: .
    env_file:
      - path: .env
        required: false
    expose:
      - "8000"
    volumes:
      - faceops-data:/data
      - faceops-models:/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 9
      start_period: 15s
    restart: unless-stopped

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    command: caddy reverse-proxy --from https://polyoj.io.vn --to http://faceops:8000
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  # Required so a CI job cannot silently create a second, empty database volume.
  faceops-data:
    name: ${FACEOPS_DATA_VOLUME:?Set FACEOPS_DATA_VOLUME to the existing Docker volume name}
  faceops-models:
  caddy_data:
  caddy_config:
